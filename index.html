<style>
@font-face {
  font-family: "Titillium Web";
  src: url("./fonts/TitilliumWeb-SemiBold.ttf") format("truetype");
  font-weight: 100 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Titillium Web";
  src: url("./fonts/TitilliumWeb-Bold.ttf") format("truetype");
  font-weight: 501 900;
  font-style: normal;
  font-display: swap;
}
:root {
  --paper: #f1f3f7;
  --card: #ffffff;
  --ink: #101b33;
  --ink2: #000000;
  --text: #000000;
  --banner: #007D34;
  --ink3: #8d96ad;
  --line: #d3d9e4;
  --line2: #e6eaf1;
  --stamp: #2342c4;
  --flag: #f4b52e;
  --flag-soft: #ffe7a8;
  --ok: #1b7a58;
  --bad: #b3261e;
  --serif: "Titillium Web", serif;
  --sans: "Titillium Web", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--text); font: 15px/1.5 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0 0 10px; max-width: 68ch; }
a { color: var(--stamp); }
:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }

.who { display: flex; align-items: center; gap: 6px; font-size: 14px; flex-wrap: wrap; }
.who .name { margin-right: 8px; color: #fff; }
.link { background: none; border: 0; color: #fff; font: inherit; font-size: 14px; padding: 6px 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255, 255, 255, .45); }
.link:hover { text-decoration-color: #fff; }
.link:focus-visible { outline-color: var(--flag); }

.tabs { background: var(--card); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; font: inherit; font-weight: 500; color: var(--ink2); padding: 12px 14px 9px; cursor: pointer; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--stamp); font-weight: 650; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 24px; }

/* ── Pulsanti ── */
.btn { display: inline-block; text-decoration: none; font: inherit; font-weight: 600; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 4px; cursor: pointer; }
.btn:hover { background: var(--line2); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #22304f; }
.btn-main { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn-main:hover { background: #1c37a3; }
.btn-danger { border-color: var(--bad); color: var(--bad); }
.btn-danger:hover { background: #fbeceb; }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ── Parte alta: stato + fila ── */
.top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 28px; }
.panel { background: var(--card); border-left: 6px solid var(--stamp); padding: 20px 22px; }
.panel h2 { margin-bottom: 8px; }
.panel .row { margin-top: 12px; }
.panel-turn { background: var(--flag); border-left-color: var(--ink); }
.turn-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.turn-clock { font-family: var(--serif); font-size: 64px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.panel-ok { border-left-color: var(--ok); }
.panel-closed { border-left-color: var(--ink3); }
.big-cd { font-family: var(--serif); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }

.queue h3 { margin-bottom: 8px; }
.queue ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.queue li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.queue .pos { width: 26px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.queue .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue li.is-active { background: var(--flag-soft); font-weight: 600; }
.queue li.is-me .nm::after { content: " (tu)"; color: var(--ink2); font-weight: 400; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line2); color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip-live { background: var(--ink); color: #fff; }
.queue .foot { margin-top: 8px; }

/* ── Griglia turni ── */
.grid-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.weeknav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin: 10px 0 0; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line); background: #fff; }
.legend .l-mine { background: var(--ink); border-color: var(--ink); }
.legend .l-taken { background: #e3e8f1; border-color: #e3e8f1; }
.legend .l-extra { background: #f8d7d4; border-color: var(--bad); }
.scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 680px; table-layout: fixed; }
.grid th { font-weight: 600; text-align: left; padding: 10px 8px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
.grid th .dn { display: block; }
.grid th .dd { display: block; font-weight: 400; color: var(--ink2); font-size: 13px; }
.grid th.hr, .grid td.hr { width: 78px; position: sticky; left: 0; background: var(--card); z-index: 1; border-right: 1px solid var(--line2); }
.grid td { padding: 3px; border-bottom: 1px solid var(--line2); }
.grid td.hr { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; padding: 3px 8px; }
.grid tr:last-child td { border-bottom: 0; }
.cell { display: block; width: 100%; min-height: 40px; font: inherit; font-size: 13px; text-align: left; padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink3); cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell.taken { background: #e3e8f1; border-color: #e3e8f1; color: var(--ink); }
.cell.mine { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.cell.act { cursor: pointer; }
.grid.editing .cell.free { border: 1px dashed #d9a21b; color: #4b5775; }
.cell.free.act:hover { background: var(--flag-soft); border-color: var(--flag); color: var(--ink); }
.cell.mine.act:hover { background: #2a3a63; }
.cell.taken.act:hover { background: #d3daea; }
.cell.taken.extra { background: #f8d7d4; border-color: #e3a29d; color: var(--bad); font-weight: 600; }
.cell.mine.extra { background: var(--bad); border-color: var(--bad); color: #fff; }
.cell.taken.extra.act:hover { background: #f1c0bb; }
.cell.mine.extra.act:hover { background: #8f1d17; }

/* ── Schede amministratore ── */
.card { background: var(--card); border: 1px solid var(--line); padding: 20px 22px; margin-bottom: 24px; }
.card h2 { margin-bottom: 10px; }
label { display: block; font-weight: 600; margin-bottom: 4px; }
input, select, textarea { font: inherit; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); width: 100%; max-width: 420px; }
input:focus, select:focus, textarea:focus { border-color: var(--stamp); outline: none; box-shadow: 0 0 0 3px rgba(35, 66, 196, .18); }
textarea { max-width: 520px; display: block; margin-bottom: 12px; }
.field { margin-bottom: 14px; }
.field .hint { font-size: 13px; color: var(--ink2); margin-top: 3px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 24px; }
table.list { width: 100%; border-collapse: collapse; }
.list th { text-align: left; font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--ink); font-size: 14px; }
.list td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.list td.act { text-align: right; white-space: nowrap; }
.list td.act .btn { margin-left: 4px; }
.mono { font-variant-numeric: tabular-nums; }
.off { color: var(--ink3); }
ul.log { list-style: none; padding: 0; margin: 0; }
ul.log li { padding: 6px 0; border-bottom: 1px solid var(--line2); display: flex; gap: 14px; }
ul.log time { color: var(--ink2); min-width: 130px; font-variant-numeric: tabular-nums; }
.tbl-scroll { overflow-x: auto; }

/* ── Accesso ── */
.login { max-width: 400px; margin: 9vh auto 0; padding: 0 20px; }
.login .box { background: var(--card); border-top: 6px solid var(--ink); padding: 28px 26px 26px; }
.login h1 { font-size: 28px; margin-bottom: 6px; }
.login .btn { width: 100%; margin-top: 6px; }
.login input { max-width: none; }
.err { color: var(--bad); margin: 8px 0 0; min-height: 22px; font-weight: 500; }

/* ── Finestra di dialogo e avvisi ── */
dialog { border: 0; padding: 22px 24px; max-width: min(560px, calc(100vw - 24px)); width: 100%; box-shadow: 0 10px 40px rgba(16, 27, 51, .3); background: var(--card); color: var(--text); border-top: 6px solid var(--ink); }
dialog::backdrop { background: rgba(16, 27, 51, .55); }
dialog h2 { margin-bottom: 10px; }
dialog.wide { max-width: min(760px, calc(100vw - 24px)); }
.dlg-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.warn { background: var(--flag-soft); padding: 8px 12px; margin-bottom: 12px; border-left: 4px solid var(--flag); }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 520px; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 4px; box-shadow: 0 6px 20px rgba(16, 27, 51, .3); text-align: center; }
.toast.bad { background: var(--bad); }

@media (max-width: 820px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 16px; }
  .bar-in, .tabs-in { padding-left: 16px; padding-right: 16px; }
  .turn-clock { font-size: 52px; }
}

@media print {
  body { background: #fff; }
  .bar, .tabs, .noprint, #toast { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .top { display: none; }
  .scroll { border: 0; overflow: visible; }
  table.grid { min-width: 0; }
  .cell.mine { background: #fff; color: var(--ink); border-color: var(--ink); }
  .cell.extra, .cell.mine.extra { background: #fff; color: var(--bad); border-color: var(--bad); }
  body.print-cred #app { display: none; }
  body.print-cred dialog[open] { position: static; box-shadow: none; max-width: none; border-top: 0; padding: 0; }
  body.print-cred dialog .dlg-actions { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.guide h2 { margin-bottom: 8px; }
.guide h3 { font-size: 18px; margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid var(--line2); }
.guide h4 { font-size: 15px; margin: 16px 0 4px; }
.guide p, .guide li { max-width: none; }
.guide ul, .guide ol { padding-left: 22px; margin: 8px 0; }
.guide li { margin: 3px 0; }
.guide code { background: var(--line2); padding: 1px 5px; border-radius: 3px; font-size: .92em; }
.guide pre { background: var(--line2); padding: 12px 14px; overflow-x: auto; border-radius: 4px; }
.guide pre code { background: none; padding: 0; }
</style>
</head>
<body>
  <div id="app"></div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>window.APP_URL = location.href.split('#')[0].split('?')[0];</script>
  <script>
(() => {
  'use strict';

  // ───────────── Costanti e utilità ─────────────
  const DAY_SHORT = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven'];
  const DAY_LONG = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì'];
  const WEEKDAYS = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  const PHASE_LABEL = {
    prequeue: 'Sala d\'attesa aperta',
    open: 'Prenotazioni aperte',
    full: 'Tutti i turni sono occupati',
    expired: 'Finestra di prenotazione chiusa',
    closed: 'Prenotazioni chiuse dall\'amministratore',
  };
  const END_REASON = {
    finished: 'Hai terminato il tuo turno.',
    timeout: 'Il tempo a tua disposizione è scaduto.',
    full: 'Nel frattempo tutti i turni sono stati occupati.',
    admin: 'L\'amministratore ha chiuso il tuo turno.',
    expired: 'La finestra di prenotazione si è chiusa.',
    closed: 'Le prenotazioni sono state chiuse.',
  };

  const app = document.getElementById('app');
  const dlg = document.getElementById('dlg');
  const toastBox = document.getElementById('toast');

  let S = null;            // ultimo stato dal server
  let me = null;           // utente collegato
  let tab = 'turni';
  let viewWeek = null;     // null = prima settimana del ciclo in prenotazione
  let skew = 0;            // orario server - orario locale
  let sigPrev = '';
  let busy = false;
  let pollTimer = null;
  let tickTimer = null;

  const pad = (n) => String(n).padStart(2, '0');
  const serverNow = () => Date.now() + skew;

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    const add = (k) => {
      if (k == null || k === false) return;
      if (Array.isArray(k)) k.forEach(add);
      else el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    };
    kids.forEach(add);
    return el;
  }

  function addDays(s, n) {
    const [y, m, d] = s.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d + n));
    return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
  }
  const fmtDay = (s) => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
  function weekLabel(days) {
    const [y1, m1, d1] = days[0].split('-').map(Number);
    const [y2, m2, d2] = days[4].split('-').map(Number);
    return m1 === m2
      ? `${d1}–${d2} ${MONTHS[m1 - 1]} ${y1}`
      : `${d1} ${MONTHS[m1 - 1]} – ${d2} ${MONTHS[m2 - 1]} ${y2}`;
  }
  const fmtWhen = (ts) => new Intl.DateTimeFormat('it-IT', {
    timeZone: 'Europe/Rome', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit',
  }).format(new Date(ts));
  const fmtLog = (ts) => new Intl.DateTimeFormat('it-IT', {
    timeZone: 'Europe/Rome', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).format(new Date(ts));
  const plural = (n, one, many) => (n === 1 ? one : many);

  function fmtCd(ms, fmt) {
    const s = Math.ceil(Math.max(0, ms) / 1000);
    if (fmt === 'clock') return `${Math.floor(s / 60)}:${pad(s % 60)}`;
    const d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (d > 0) return `${d} ${plural(d, 'giorno', 'giorni')} ${hh} h ${m} min`;
    if (hh > 0) return `${hh} h ${m} min ${pad(sec)} s`;
    return `${m} min ${pad(sec)} s`;
  }
  function cd(deadline, fmt, cls) {
    return h('span', { class: cls || '', dataset: { cd: String(deadline), fmt } }, fmtCd(deadline - serverNow(), fmt));
  }
  function tick() {
    for (const el of document.querySelectorAll('[data-cd]')) {
      el.textContent = fmtCd(Number(el.dataset.cd) - serverNow(), el.dataset.fmt);
    }
  }

  function toast(msg, bad) {
    const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
    toastBox.append(t);
    setTimeout(() => t.remove(), bad ? 5000 : 2800);
  }

  const TOK = 'turni_token';
  let memTok = null;
  const getTok = () => { try { return localStorage.getItem(TOK) || memTok; } catch { return memTok; } };
  const setTok = (t) => { memTok = t; try { t ? localStorage.setItem(TOK, t) : localStorage.removeItem(TOK); } catch { /* ignora */ } };

  // ───────────── Collegamento a Supabase ─────────────
  const SUPABASE_URL = 'https://qinkysjtxborkwvaiqoo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_UCVePtbIxdklv14pWqp7Ww_2DDRMxq0';   // chiave pubblica: può stare nella pagina

  // Traduce le chiamate dell'interfaccia nelle funzioni del database (vedi 01_schema.sql)
  function rpcFor(method, path, q, b, tok) {
    const t = { p_token: tok || null };
    switch (method + ' ' + path) {
      case 'POST /api/login': return ['app_login', { p_username: b.username, p_password: b.password }];
      case 'POST /api/logout': return ['app_logout', t];
      case 'POST /api/push/subscribe': return ['app_push_subscribe', { ...t, p_sub: b.sub }];
      case 'POST /api/push/unsubscribe': return ['app_push_unsubscribe', { ...t, p_endpoint: b.endpoint }];
      case 'GET /api/me': return ['app_me', t];
      case 'POST /api/change-password': return ['app_change_password', { ...t, p_current: b.current, p_next: b.next }];
      case 'GET /api/state': return ['app_state', { ...t, p_week: q.week || null }];
      case 'POST /api/queue/join': return ['app_join', t];
      case 'POST /api/queue/leave': return ['app_leave', t];
      case 'POST /api/queue/finish': return ['app_finish', t];
      case 'POST /api/book': return ['app_book', { ...t, p_week: b.week || null, p_day: b.day, p_hour: b.hour }];
      case 'POST /api/unbook': return ['app_unbook', { ...t, p_week: b.week || null, p_day: b.day, p_hour: b.hour }];
      case 'POST /api/admin/slot': return ['app_admin_slot', { ...t, p_week: b.week, p_day: b.day, p_hour: b.hour, p_user_id: b.userId || null }];
      case 'POST /api/admin/queue': return ['app_admin_queue', { ...t, p_action: b.action, p_user_id: b.userId }];
      case 'POST /api/admin/config': return ['app_admin_config', { ...t, p_cfg: b }];
      case 'GET /api/admin/users': return ['app_admin_users', t];
      case 'POST /api/admin/users': return ['app_admin_create_users', { ...t, p_names: b.names, p_role: b.role }];
      case 'GET /api/admin/log': return ['app_admin_log', t];
      case 'GET /api/admin/export': return ['app_admin_export', { ...t, p_week: q.week || null }];
    }
    const m = path.match(/^\/api\/admin\/users\/([^/]+)\/(reset|update|delete)$/);
    if (m && m[2] === 'reset') return ['app_admin_reset', { ...t, p_user_id: m[1] }];
    if (m && m[2] === 'delete') return ['app_admin_delete_user', { ...t, p_user_id: m[1] }];
    if (m && m[2] === 'update') return ['app_admin_update_user', { ...t, p_user_id: m[1], p_name: b.name === undefined ? null : b.name, p_active: b.active === undefined ? null : b.active }];
    return null;
  }

  async function callServer(method, url, body) {
    const [path, qs] = url.split('?');
    const query = Object.fromEntries(new URLSearchParams(qs || ''));
    const call = rpcFor(method, path, query, body || {}, getTok());
    if (!call) return { status: 404, data: { error: 'Non trovato' } };
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + call[0], {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify(call[1]),
    });
    let data = null;
    try { data = await res.json(); } catch { /* risposta vuota */ }
    if (!res.ok) return { status: res.status, data: { error: (data && data.message) || 'Operazione non riuscita' } };
    if (data && data.error && data.status) return { status: data.status, data: { error: data.error } };   // es. accesso errato
    return { status: 200, data: data };
  }

  async function api(method, url, body) {
    const quiet = url === '/api/me' || url === '/api/login';
    let res;
    try { res = await callServer(method, url, body); }
    catch { throw new Error('Connessione assente. Controlla la rete e riprova.'); }
    const data = res && res.data;
    if (url === '/api/login' && res.status === 200) setTok(data.token);
    if (url === '/api/logout') setTok(null);
    if (res.status === 401 && !quiet) { onLoggedOut(); throw new Error('Sessione scaduta: accedi di nuovo.'); }
    if (res.status !== 200) throw new Error((data && data.error) || 'Operazione non riuscita');
    return data;
  }

  // ───────────── Dialoghi ─────────────
  function showDialog(nodes, wide) {
    dlg.className = wide ? 'wide' : '';
    dlg.replaceChildren(...nodes);
    if (!dlg.open) dlg.showModal();
  }
  function closeDialog() { if (dlg.open) dlg.close(); }
  dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDialog(); });
  dlg.addEventListener('close', () => document.body.classList.remove('print-cred'));

  // ───────────── Accesso ─────────────
  function showLogin(message) {
    stopLive();
    S = null; me = null;
    const err = h('p', { class: 'err', role: 'alert' }, message || '');
    const user = h('input', { id: 'u', name: 'username', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true });
    const pass = h('input', { id: 'p', name: 'password', type: 'password', autocomplete: 'current-password', required: true });
    const btn = h('button', { class: 'btn btn-dark', type: 'submit' }, 'Accedi');
    const form = h('form', {
      onsubmit: async (e) => {
        e.preventDefault();
        btn.disabled = true; err.textContent = '';
        try {
          const r = await api('POST', '/api/login', { username: user.value, password: pass.value });
          me = r.user;
          if (me.mustChange) showForcedChange(pass.value); else startApp();
        } catch (ex) {
          err.textContent = ex.message; btn.disabled = false; pass.select();
        }
      },
    },
    h('div', { class: 'field' }, h('label', { for: 'u' }, 'Nome utente'), user),
    h('div', { class: 'field' }, h('label', { for: 'p' }, 'Password'), pass),
    btn, err);
    app.replaceChildren(h('div', { class: 'login' }, h('div', { class: 'box' },
      h('h1', null, 'Turni in biblioteca'),
      h('p', { class: 'muted' }, 'Accedi con l\'account personale che ti ha dato l\'amministratore.'),
      form)));
    user.focus();
  }

  function showForcedChange(currentPw) {
    stopLive();
    const err = h('p', { class: 'err', role: 'alert' });
    const cur = h('input', { id: 'c', type: 'password', autocomplete: 'current-password', required: true, value: currentPw || '' });
    const n1 = h('input', { id: 'n1', type: 'password', autocomplete: 'new-password', minlength: '8', required: true });
    const n2 = h('input', { id: 'n2', type: 'password', autocomplete: 'new-password', minlength: '8', required: true });
    const btn = h('button', { class: 'btn btn-dark', type: 'submit' }, 'Salva la password');
    const form = h('form', {
      onsubmit: async (e) => {
        e.preventDefault();
        err.textContent = '';
        if (n1.value !== n2.value) { err.textContent = 'Le due password non coincidono.'; return; }
        btn.disabled = true;
        try {
          const r = await api('POST', '/api/change-password', { current: cur.value, next: n1.value });
          me = r.user; startApp();
        } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
      },
    },
    h('div', { class: 'field' }, h('label', { for: 'c' }, 'Password provvisoria'), cur),
    h('div', { class: 'field' }, h('label', { for: 'n1' }, 'Nuova password'), n1,
      h('div', { class: 'hint' }, 'Almeno 8 caratteri. Sceglila tu: nessun altro deve conoscerla.')),
    h('div', { class: 'field' }, h('label', { for: 'n2' }, 'Ripeti la nuova password'), n2),
    btn, err);
    app.replaceChildren(h('div', { class: 'login' }, h('div', { class: 'box' },
      h('h1', null, `Ciao ${me.name.split(' ')[0]}`),
      h('p', { class: 'muted' }, 'Prima di continuare, sostituisci la password provvisoria con una tua.'),
      form)));
    (currentPw ? n1 : cur).focus();
  }

  function changePasswordDialog() {
    const err = h('p', { class: 'err', role: 'alert' });
    const cur = h('input', { id: 'c', type: 'password', autocomplete: 'current-password', required: true });
    const n1 = h('input', { id: 'n1', type: 'password', autocomplete: 'new-password', minlength: '8', required: true });
    const n2 = h('input', { id: 'n2', type: 'password', autocomplete: 'new-password', minlength: '8', required: true });
    const save = async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (n1.value !== n2.value) { err.textContent = 'Le due password non coincidono.'; return; }
      try {
        await api('POST', '/api/change-password', { current: cur.value, next: n1.value });
        closeDialog(); toast('Password cambiata');
      } catch (ex) { err.textContent = ex.message; }
    };
    showDialog([
      h('h2', null, 'Cambia password'),
      h('form', { onsubmit: save },
        h('div', { class: 'field' }, h('label', { for: 'c' }, 'Password attuale'), cur),
        h('div', { class: 'field' }, h('label', { for: 'n1' }, 'Nuova password'), n1),
        h('div', { class: 'field' }, h('label', { for: 'n2' }, 'Ripeti la nuova password'), n2),
        err,
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn btn-dark', type: 'submit' }, 'Salva la password'),
          h('button', { class: 'btn', type: 'button', onclick: closeDialog }, 'Annulla'))),
    ]);
    cur.focus();
  }

  async function logout() {
    try { await Alerts.pushOff(); } catch { /* ignora */ }
    try { await api('POST', '/api/logout'); } catch { /* già uscito */ }
    showLogin();
  }
  function onLoggedOut() { showLogin('La sessione è scaduta. Accedi di nuovo.'); }

  // ───────────── Collegamento in tempo reale ─────────────
  let ws = null, wsBeat = null, wsRetry = null, wsDebounce = null;
  function connect() { openLive(); }
  function openLive() {
    if (ws && ws.readyState <= 1) return;
    try { ws = new WebSocket(SUPABASE_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0'); }
    catch { return; }
    const sock = ws;
    sock.onopen = () => {
      sock.send(JSON.stringify({ topic: 'realtime:turni', event: 'phx_join', ref: '1', payload: { config: { broadcast: { self: false }, presence: { key: '' }, private: false } } }));
      wsBeat = setInterval(() => { try { sock.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: '2' })); } catch { /* ignora */ } }, 25000);
    };
    sock.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.event === 'broadcast' && m.payload && m.payload.event === 'tick') {
          clearTimeout(wsDebounce);
          wsDebounce = setTimeout(() => { if (!inflight && !busy && !pend && !document.hidden) refresh(); }, 120);
        }
      } catch { /* ignora */ }
    };
    sock.onclose = () => { clearInterval(wsBeat); if (ws === sock) ws = null; if (tickTimer) { clearTimeout(wsRetry); wsRetry = setTimeout(openLive, 5000); } };
    sock.onerror = () => { try { sock.close(); } catch { /* ignora */ } };
  }
  function stopLive() {
    clearTimeout(pollTimer); clearInterval(tickTimer); clearTimeout(wsRetry); clearTimeout(wsDebounce); clearInterval(wsBeat);
    pollTimer = tickTimer = null;
    if (ws) { try { ws.close(); } catch { /* ignora */ } ws = null; }
  }
  let inflight = false;

  const GUIDE_STUDENT = "# Turni in biblioteca — guida per gli studenti\n\nQuesta guida spiega come prenotare i tuoi turni in biblioteca e come ricevere gli avvisi sul telefono.\n\n## In breve\n\n- Ogni due settimane, nel giorno e all'ora di apertura (giovedì alle 08:30), si aprono le prenotazioni per le **due settimane che iniziano il lunedì successivo**.\n- Ti metti in **fila**. Quando tocca a te hai **90 secondi** per scegliere i tuoi turni; poi passa al successivo.\n- Puoi prenotare al massimo **6 ore** sulle due settimane (il valore esatto lo vedi nella pagina).\n- Se attivi gli **avvisi sul telefono**, ricevi una notifica anche a schermo bloccato o con la pagina chiusa.\n\n## 1. Primo accesso\n\n1. Apri il link della piattaforma che ti ha dato l'amministratore.\n2. Entra con il **nome utente** e la **password provvisoria** che hai ricevuto.\n3. Al primo accesso ti viene chiesto di scegliere una **nuova password** (almeno 8 caratteri): scrivila da qualche parte, perché solo l'amministratore può reimpostarla.\n4. Se sbagli la password 8 volte, l'accesso si blocca per 5 minuti: basta aspettare.\n\nPuoi cambiare la password quando vuoi con **Cambia password** in alto. Con **Esci** chiudi la sessione.\n\n## 2. Come funziona la prenotazione\n\nLe prenotazioni si aprono nel giorno e all'ora indicati nella pagina. Da quel momento chi è in fila viene chiamato **uno alla volta, nell'ordine in cui è entrato**. Quando è il tuo momento:\n\n- hai **90 secondi** (il tempo esatto è scritto nella pagina) per prenotare o liberare turni;\n- vedi un grande orologio con il tempo che resta;\n- quando hai finito puoi premere **Ho finito**, così il turno passa subito al successivo;\n- se il tempo scade, il turno passa comunque al successivo.\n\n## 3. Entrare in fila\n\n1. Quando le prenotazioni sono aperte, premi **Entra in fila**.\n2. Vedi quante persone hai davanti e una stima dell'attesa.\n3. Se cambi idea, premi **Esci dalla fila**.\n\nImportante: se quando arriva il tuo turno risulti **non collegato da più di 30 minuti**, vieni saltato e puoi rimetterti in fila. Basta aprire la pagina poco prima del tuo turno: con gli avvisi attivi la notifica «Sei il prossimo» ti avvisa **10 secondi** prima dell'inizio del tuo turno.\n\n## 4. Quando tocca a te\n\nIl riquadro in alto a sinistra diventa giallo e compare la scritta **«Tocca a te»** con il conto alla rovescia. Se la pagina è aperta, il telefono vibra.\n\n- Tocca un turno **libero** per prenotarlo.\n- Tocca un **tuo** turno per liberarlo.\n- Con i pulsanti sopra la griglia ti sposti tra la **1ª e la 2ª settimana** del ciclo.\n\nLe modifiche si vedono subito. Puoi prenotare solo durante il tuo turno in fila.\n\n## 5. Quante ore posso prenotare\n\nIl limite è di **6 ore complessive sulle due settimane** (non 6 ore per settimana). Nella pagina leggi sempre quante ne hai già prenotate.\n\n## 6. Ore oltre il limite («extra»)\n\nSe hai già raggiunto il limite, puoi prenotare ancora soltanto i turni **liberi di oggi e di domani**. Questi turni compaiono **in rosso** e si chiamano «extra». Esempio: se mercoledì ci sono turni scoperti, puoi aggiungerti oltre il limite soltanto a partire da martedì.\n\n## 7. Turni condivisi (sovrapposizione)\n\nNormalmente un turno occupato da un altro studente non si può prenotare. Fa eccezione il caso in cui **tutti i turni delle due settimane sono già occupati**: allora puoi prenotare anche un turno già occupato, **in coppia** con chi c'è già.\n\n- Se qualcuno libera il suo turno, le coppie già fatte restano.\n- Ognuno può liberare **solo la propria** prenotazione.\n\n## 8. Giorni passati e settimana precedente\n\n- I **giorni passati non si possono modificare**.\n- La settimana che precede il ciclo è visibile e puoi prenotare o liberare soltanto i turni **di oggi e di domani**. Per aprirla usa «‹ Precedente» sopra la griglia.\n\n## 9. Avvisi sul telefono\n\nGli avvisi servono a non perdere il tuo turno anche se blocchi il telefono, lo schermo si spegne o chiudi la pagina. Ogni avviso fa **vibrare** il telefono e fa **suonare** la notifica. Ricevi tre messaggi:\n\n- **«Sei il prossimo»** (due vibrazioni): quando inizia il turno della persona che ti precede. Hai circa un turno di preavviso: apri la pagina.\n- **«Mancano 10 secondi»** (vibrazione rapida): il tuo turno sta per iniziare. Tieni la pagina aperta.\n- **«Tocca a te!»** (vibrazione lunga): il tuo turno è iniziato e il tempo sta scorrendo.\n\nNon ricevi nessun avviso quando premi **Entra in fila**.\n\n### Come attivarli\n\n1. Accedi dal telefono ed entra nella scheda **Turni e fila**.\n2. Premi **«Attiva gli avvisi sul telefono»** e, quando il telefono lo chiede, scegli **Consenti**.\n3. Fatto: vedi la scritta «Avvisi attivi». Resta attivo anche nei giorni successivi. Se vuoi disattivarlo, modifica le impostazioni di autorizzazione sullo smartphone.\n4. Verifica se le autorizzazioni consentono la riproduzione di vibrazione e audio.\n\n### iPhone\n\nSu iPhone gli avvisi funzionano solo se la pagina è installata come app (iOS 16.4 o successivo):\n\n1. Apri la piattaforma con **Safari**.\n2. Tocca **Condividi** e poi **Aggiungi alla schermata Home**.\n3. Apri la piattaforma **dall'icona** appena creata (non da Safari).\n4. Accedi e premi **«Attiva gli avvisi sul telefono»**.\n\n### Android\n\nFunziona direttamente dal browser. Controlla che il risparmio energetico non blocchi le notifiche del browser.\n\n### Se non arrivano\n\n- Controlla che le notifiche del browser (o dell'app sulla Home) non siano bloccate nelle impostazioni del telefono.\n- Non usare la modalità «Non disturbare» o silenziosa se vuoi sentire suono e vibrazione.\n- Il suono è quello di notifica del telefono: se vuoi uno più riconoscibile, su Android tieni premuta una notifica della piattaforma → **Impostazioni** → scegli un suono diverso. Su iPhone vale il suono di sistema.\n- Se il telefono è **spento** o senza rete l'avviso non può arrivare: se torna acceso mentre è ancora valido (la durata di un turno) lo ricevi, altrimenti viene scartato.\n- Gli avvisi aiutano ma non sostituiscono la tua attenzione: tieni d'occhio l'orario di apertura.\n\n## 10. Se qualcosa non va\n\n- **Ho dimenticato la password**: chiedi all'amministratore una nuova password provvisoria.\n- **Non riesco a modificare nulla**: puoi farlo solo durante il tuo turno in fila e mai nei giorni passati.\n- **Non riesco a prenotare un turno occupato**: è normale, finché non sono occupati tutti i turni delle due settimane.\n- **Vedo ancora la versione vecchia della pagina**: ricarica la pagina (sul telefono chiudi e riapri il browser).\n- **Il mio turno è stato saltato**: non risultavi collegato da più di 30 minuti. Premi **Entra in fila** per rimetterti in coda.\n- **Ho finito il turno ma voglio modificare ancora**: puoi rimetterti in fila; vieni messo dopo chi sta già aspettando.\n\n## Consigli\n\n- Arriva alla pagina qualche minuto **prima** dell'apertura.\n- Tieni lo schermo acceso e la pagina aperta mentre aspetti, soprattutto se sei tra i primi.\n- Decidi i turni **prima** di essere chiamato: 90 secondi passano in fretta.\n- Se non ti servono più, libera i turni: li usa chi viene dopo di te.\n";
  const GUIDE_ADMIN = "# Turni in biblioteca — guida per gli amministratori\n\nQuesta guida spiega come usare la piattaforma ogni giorno. L'installazione è descritta in `istruzioni_supabase.md`. Ogni amministratore trova questo testo anche nella scheda **Guida**.\n\n## Come funziona, in breve\n\n- Ogni **due settimane**, nel giorno e all'ora di apertura (di default giovedì alle 08:30), si aprono le prenotazioni per le **due settimane che iniziano il lunedì successivo**.\n- Gli studenti si mettono in **fila**; quando tocca a loro hanno **60 secondi** per prenotare. Poi passa il successivo.\n- Ogni studente può prenotare al massimo **6 ore** sulle due settimane. Oltre il limite solo turni liberi di oggi e di domani (in rosso, «extra»).\n- Un turno già occupato si può prenotare «in coppia» solo quando **tutti i turni delle due settimane sono occupati** (sovrapposizione).\n- Gli studenti **non possono modificare i giorni passati**; l'amministratore sì.\n- Gli account li crei tu. Gli studenti cambiano la password al primo accesso.\n- Gli studenti possono ricevere **notifiche push** sul telefono, anche a schermo bloccato.\n\nIl tuo account ha cinque schede: **Turni e fila**, **Studenti**, **Impostazioni**, **Registro** e **Guida**.\n\n## Scheda «Turni e fila»\n\nIn alto vedi lo stato del ciclo e la **fila**: chi è attivo e chi aspetta.\n\n- **Terminare il turno** di chi è attivo: il turno passa subito al successivo.\n- **Rimuovere** una persona dalla fila.\n\nNella griglia puoi toccare **qualsiasi casella**, in qualunque settimana e anche nei giorni passati, per assegnare il turno a uno studente o per liberarlo.\n\n- Se assegni un turno già occupato, le persone presenti vengono **sostituite**.\n- **«Libera il turno»** toglie tutte le persone presenti.\n- Se uno studente supera il limite di ore, compare un avviso, ma l'assegnazione viene eseguita.\n- **Esporta CSV** e **Stampa** scaricano o stampano la settimana che stai guardando.\n- I pulsanti sopra la griglia ti spostano tra le settimane.\n\n## Scheda «Studenti»\n\nElenco degli account, con le ore prenotate sulle due settimane e lo stato (attivo, disattivato, password provvisoria).\n\n### Creare gli account\n\n1. Premi **Aggiungi account**.\n2. Scrivi **un nome per riga** (massimo 60 per volta) e premi **Crea account**.\n3. Compare l'elenco con **nome utente** e **password provvisoria** di ognuno. Usa subito **Copia**, **Scarica CSV** o **Stampa**: dopo aver chiuso la finestra le password provvisorie non si possono rivedere.\n4. Consegna a ogni studente le sue credenziali e la guida studenti.\n\nIl nome utente è il nome in minuscolo, senza accenti e con i punti (es. «Mario Rossi» diventa `mario.rossi`). Se esiste un omonimo viene aggiunto un numero.\n\n### Per ogni account\n\n- **Nuova password**: genera una password provvisoria nuova e chiude le sessioni aperte.\n- **Disattiva / Riattiva**: blocca l'accesso senza cancellare nulla.\n- **Elimina**: cancella l'account **e le sue prenotazioni**.\n\n## Scheda «Impostazioni»\n\n- **Durata del turno in fila** (secondi, da 10 a 600; default 60).\n- **Ore massime** per studente sulle due settimane (default 6).\n- **Giorno e ora di apertura** (default giovedì 08:30, ora italiana). Si prenotano le due settimane che iniziano il lunedì successivo.\n- **Sala d'attesa anticipata** (minuti): con 0 si entra in fila solo all'ora di apertura; con un valore maggiore chi arriva prima si mette prima in fila.\n\nPremi **Salva le impostazioni** per applicare le modifiche. La validità delle notifiche push segue da sola la durata del turno.\n\n## Scheda «Registro»\n\nLe ultime 500 azioni: prenotazioni, liberazioni, ingressi in fila, turni scaduti o saltati e operazioni dell'amministratore. È il primo posto da guardare quando uno studente segnala un problema.\n\n## Regole automatiche da conoscere\n\n- Chi risulta **non collegato da più di 30 minuti** quando arriva il suo turno viene **saltato** e può rimettersi in fila.\n- Chi ha finito o ha lasciato scadere il turno può **rimettersi in fila**, dopo chi aspetta già.\n- La **settimana precedente** al ciclo è modificabile dagli studenti solo per i turni di oggi e di domani.\n- **Sovrapposizione**: quando ogni turno delle due settimane ha almeno una persona, gli studenti possono prenotare anche i turni occupati. Se qualcuno libera un turno, le coppie già fatte restano. Ognuno libera solo la propria prenotazione.\n- La **fila avanza da sola** anche se nessuno ha la pagina aperta: un controllo automatico gira sul database ogni 2 secondi circa.\n\n## Notifiche push\n\nGli studenti possono premere **«Attiva gli avvisi sul telefono»**. Da quel momento il telefono è registrato e riceve tre messaggi, anche a schermo bloccato, a schermo spento o con la pagina chiusa. Ognuno fa vibrare il telefono e suonare la notifica, con una vibrazione diversa:\n\n- **«Sei il prossimo»**: quando inizia il turno di chi li precede.\n- **«Mancano 10 secondi»**: circa 10 secondi prima che inizi il loro turno (non inviato se il turno dura 20 secondi o meno).\n- **«Tocca a te!»**: quando inizia il loro turno.\n\nNessun avviso parte quando lo studente preme **Entra in fila**.\n\nCose da sapere:\n\n- Ogni telefono si registra da solo; l'amministratore non deve fare nulla.\n- Al logout dello studente il telefono viene tolto dall'elenco; eliminando l'account si cancellano anche i suoi telefoni.\n- Su **iPhone** le notifiche funzionano solo se lo studente ha aggiunto la pagina alla **schermata Home** e la apre da lì (iOS 16.4 o successivo). Su Android basta Chrome.\n- Gli avvisi restano validi quanto dura un turno (l'avviso dei 10 secondi: 10 secondi): se il telefono è spento o senza rete, un avviso tardivo viene scartato. Se più avvisi restano in attesa, al ritorno della rete arriva solo l'ultimo.\n- Il suono è quello di notifica del telefono: una pagina web non può imporne uno proprio. Quando la pagina è aperta, invece, suona una melodia diversa per ogni tipo di avviso.\n- Gli amministratori non ricevono notifiche.\n\n### Controllare che tutto funzioni\n\nNell'SQL Editor di Supabase:\n\n```\nselect count(*) from turni.push_subs;\n```\n\nMostra quanti telefoni sono registrati. Per vedere a chi appartengono:\n\n```\nselect u.name, s.created_at from turni.push_subs s join turni.users u on u.id = s.user_id order by s.created_at desc;\n```\n\nPer controllare che il controllo automatico della fila giri:\n\n```\nselect jobname, schedule, active from cron.job;\n```\n\nDeve comparire `turni-advance` con `active = true`. Se le notifiche non arrivano, apri su Supabase **Edge Functions → send-push → Logs** per vedere gli errori.\n\n## Manutenzione periodica\n\n- **Esportazione su Drive**: ogni giorno verso le 06:00 i CSV (uno per settimana) finiscono nella cartella Drive «Turni biblioteca - CSV». Quando due studenti condividono un turno, nel CSV compaiono entrambi i nomi separati da « + ». La chiamata giornaliera tiene anche sveglio il database gratuito.\n- **Reimpostare la password dell'amministratore**: riesegui `02_crea_admin.sql` con la nuova password, poi cancella la password dal testo.\n- **Aggiornare la pagina**: nel repository GitHub modifica o ricarica `index.html` e conferma con **Commit changes**. Possono servire alcuni minuti; gli studenti ricaricano la pagina.\n- **Fine periodo**: elimina gli account non più necessari dalla scheda **Studenti**.\n- **Non rieseguire `01_schema.sql`** dopo aver applicato gli aggiornamenti 04, 05 e 06: ripristinerebbe le funzioni vecchie.\n\n## Problemi frequenti\n\n- **Studente che ha dimenticato la password**: scheda Studenti → **Nuova password** e consegnagli quella nuova.\n- **Lo studente vede ancora la pagina vecchia**: deve ricaricare la pagina (su telefono chiudere e riaprire il browser).\n- **«Troppi tentativi di accesso»**: dopo 8 tentativi sbagliati l'accesso si blocca per 5 minuti.\n- **Non si riesce a prenotare un turno occupato**: è normale finché non sono occupati tutti i turni delle due settimane.\n- **Lo studente non riesce a modificare nulla**: può farlo solo durante il proprio turno in fila e mai nei giorni passati.\n- **La fila è ferma**: controlla che `turni-advance` sia attivo (query sopra) e guarda il Registro.\n- **Le notifiche non arrivano**: verifica che il telefono sia registrato (query sopra), che su iPhone la pagina sia aperta dall'icona della Home, che le notifiche del telefono non siano bloccate e guarda i Logs di `send-push`.\n- **Il CSV non compare su Drive**: riesegui `attiva` in Apps Script, controlla `EXPORT_SECRET` e il registro delle esecuzioni.\n- **Il progetto Supabase risulta in pausa**: riattivalo dal pannello Supabase.\n\n## Prova prima dell'uso reale\n\n1. Crea 3-4 account di prova, apri il link in più browser, mettetevi in fila e prenotate.\n2. Controlla che la casella resti colorata dopo la prenotazione, che il turno passi al successivo dopo 60 secondi e che il limite di ore funzioni.\n3. **Sovrapposizione**: assegna tutti i turni delle due settimane tranne uno e verifica che uno studente non possa prenotare un turno occupato. Poi occupa l'ultimo turno libero e verifica che la sovrapposizione sia consentita e che lo studente liberi solo il proprio nome.\n4. **Notifiche**: con un account di prova attiva gli avvisi dal telefono, blocca lo schermo e dall'account amministratore fai avanzare la fila: deve arrivare «Tocca a te!». Controlla che **non** arrivi nulla quando lo studente preme «Entra in fila» e che, con due studenti in fila, il secondo riceva «Mancano 10 secondi» poco prima dell'inizio del suo turno.\n5. Elimina gli account e le prenotazioni di prova.\n";
  function mdToHtml(md) {
    const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inl = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    let out = '', list = null, code = null, para = [];
    const flushP = () => { if (para.length) { out += '<p>' + inl(para.join(' ')) + '</p>'; para = []; } };
    const flushL = () => { if (list) { out += '</' + list + '>'; list = null; } };
    for (const line of md.split('\n')) {
      if (line.startsWith('```')) {
        if (code === null) { flushP(); flushL(); code = []; }
        else { out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = null; }
        continue;
      }
      if (code !== null) { code.push(line); continue; }
      let m;
      if (!line.trim()) { flushP(); flushL(); }
      else if ((m = line.match(/^(#{1,3}) (.*)$/))) { flushP(); flushL(); const n = m[1].length + 1; out += '<h' + n + '>' + inl(m[2]) + '</h' + n + '>'; }
      else if ((m = line.match(/^- (.*)$/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list = 'ul'; } out += '<li>' + inl(m[1]) + '</li>'; }
      else if ((m = line.match(/^\d+\. (.*)$/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list = 'ol'; } out += '<li>' + inl(m[1]) + '</li>'; }
      else if (/^\s{2,}\d+\. /.test(line) && list) { out += '<li>' + inl(line.replace(/^\s+\d+\. /, '')) + '</li>'; }
      else { flushL(); para.push(line.trim()); }
    }
    flushP(); flushL();
    return out;
  }

  async function quickSlot(kind, day, hour) {
    if (!S || !(S.canEdit || S.extraOnly)) return;

      const date = S.weekDays[day];
      if (date < S.today) { toast('Non puoi modificare i turni dei giorni passati', true); return; }
      const near = date === S.today || date === addDays(S.today, 1);   // settimana precedente e ore extra: solo oggi e domani
      if (!S.canEdit && !near) { toast('Settimana in corso: puoi prenotare solo i turni liberi di oggi e di domani', true); return; }
      if (S.myCycleHours >= S.config.maxHours && !near) { toast('Hai già raggiunto il massimo di ' + S.config.maxHours + ' ore sulle due settimane: puoi superarlo solo per i turni liberi di oggi e di domani', true); return; }
    }
    if (kind === 'unbook' && S.weekDays[day] < S.today) { toast('Non puoi modificare i turni dei giorni passati', true); return; }
    const week = S.week;
    const next = JSON.parse(JSON.stringify(S));
    next.now = serverNow();
    if (kind === 'book') {
      next.slots.push({ day, hour, userId: me.id, name: me.name, by: 'student', extra: S.myCycleHours >= S.config.maxHours || undefined });
      next.myHours++; next.myCycleHours++; if (!here.length) next.filledSlots++;
    } else {
      next.slots = next.slots.filter((x) => !(key(x) && x.userId === me.id)); next.myHours--; next.myCycleHours--;
      if (!here.some((x) => x.userId !== me.id)) next.filledSlots--;
    }
    applyState(next);
    pend++;
    try {
      const data = await api('POST', kind === 'book' ? '/api/book' : '/api/unbook', { week, day, hour });
      if (pend === 1 && data && data.week === week) applyState(data);
    } catch (ex) {
      toast(ex.message, true);
      pend--; await refresh(); pend++;
    } finally { pend--; }
  }

  async function act(fn, okMsg) {
    if (busy) return;
    busy = true;
    try {
      const data = await fn();
      if (data && data.week && data.cycle && (viewWeek ? data.week === viewWeek : data.week === data.cycle.week1)) applyState(data);
      if (data && data.warning) toast(data.warning, true);
      else if (okMsg) toast(okMsg);
    } catch (ex) {
      toast(ex.message, true);
      refresh();
    } finally { busy = false; }
  }

            ` Puoi anche chiudere la pagina o bloccare il telefono, ma ricordati di riaprirla qualche minuto prima del tuo turno: quando tocca a te hai ${cfg.turnSeconds} secondi e, se non ci sei, il turno passa al successivo.`),

  function gridSection() {
    const isAdmin = me.role === 'admin';
    const cfg = S.config;
    const canEdit = S.canEdit;
    const bySlot = new Map();
    S.slots.forEach((s) => { const k = `${s.day}-${s.hour}`; if (!bySlot.has(k)) bySlot.set(k, []); bySlot.get(k).push(s); });
    const pastDay = (d) => S.weekDays[d] < S.today;   // giorni passati: bloccati per gli studenti
    const nearDay = (d) => S.weekDays[d] === S.today || S.weekDays[d] === addDays(S.today, 1);   // ore extra: solo oggi e domani

    const thead = h('tr', null, h('th', { class: 'hr', scope: 'col' }, 'Ora'),
      S.weekDays.map((d, i) => h('th', { scope: 'col' }, h('span', { class: 'dn' }, DAY_SHORT[i]), h('span', { class: 'dd' }, fmtDay(d)))));
    const rows = [];
    for (let hr = cfg.firstHour; hr <= cfg.lastHour; hr++) {
      rows.push(h('tr', null,
        h('td', { class: 'hr' }, `${pad(hr)}–${pad(hr + 1)}`),
        [0, 1, 2, 3, 4].map((d) => {
          const list = bySlot.get(`${d}-${hr}`) || [];
          const mineS = list.find((x) => x.userId === me.id);
          const s = mineS || list[0];
          const others = list.filter((x) => x.userId !== me.id).map((x) => x.name);
          const label = `${DAY_LONG[d]} ${pad(hr)}:00-${pad(hr + 1)}:00`;
          let cls = 'cell', text = 'libero', onclick = null, status = 'libero';
          if (!s) {
            cls += ' free';
            if (isAdmin) { onclick = () => assignDialog(d, hr, null); cls += ' act'; }
            else if (!pastDay(d) && (canEdit || (S.extraOnly && nearDay(d)))) { onclick = () => quickSlot('book', d, hr); cls += ' act'; }
          } else if (mineS) {
            cls += ' mine'; text = others.length ? 'Tu + ' + others.join(' + ') : 'Tu'; status = others.length ? `prenotato da te insieme a ${others.join(', ')}` : 'prenotato da te';
            if (!pastDay(d) && (canEdit || (S.extraOnly && nearDay(d)))) { onclick = () => quickSlot('unbook', d, hr); cls += ' act'; }
          } else {
            cls += ' taken'; text = list.map((x) => x.name).join(' + '); status = `occupato da ${list.map((x) => x.name).join(', ')}`;
            if (isAdmin) { onclick = () => assignDialog(d, hr, { ...s, name: text }); cls += ' act'; }
            else if (S.overlapOpen && canEdit && !pastDay(d)) { onclick = () => quickSlot('book', d, hr); cls += ' act'; status += ', puoi sovrapporti'; }
          }
          const isExtra = mineS ? mineS.extra : (list.length === 1 && list[0].extra);
          if (isExtra) { cls += ' extra'; text += ' · extra'; status += ', ore extra oltre il limite'; }
          return h('td', null, h('button', { class: cls, type: 'button', 'aria-label': `${label}, ${status}`, title: text, onclick, 'aria-disabled': onclick ? null : 'true', tabindex: onclick ? null : '-1' }, text));
        })));
    }

    const prev = () => goWeek(addDays(S.week, -7));
    const next = () => goWeek(addDays(S.week, 7));
    const isCur = S.isCurrent;
    const badge = S.weekIndex === 1 ? ' · 1ª settimana in prenotazione' : (S.weekIndex === 2 ? ' · 2ª settimana in prenotazione' : '');
    return h('section', null,
      h('div', { class: 'grid-head' },
        h('div', null,
          h('h2', null, 'Turni della settimana'),
          h('p', { class: 'muted', style: 'margin:4px 0 0' }, weekLabel(S.weekDays), badge,
            ` · ${S.filledSlots}/${S.totalSlots} turni occupati`,
            !isAdmin ? ` · le tue ore (2 sett.): ${S.myCycleHours}/${cfg.maxHours}` : '')),
        h('div', { class: 'weeknav noprint' },
          h('button', { class: 'btn btn-sm', onclick: prev }, '‹ Precedente'),
          S.week === S.cycle.week1 ? null : h('button', { class: 'btn btn-sm', onclick: () => goWeek(S.cycle.week1) }, '1ª settimana'),
          S.week === S.cycle.week2 ? null : h('button', { class: 'btn btn-sm', onclick: () => goWeek(S.cycle.week2) }, '2ª settimana'),
          h('button', { class: 'btn btn-sm', onclick: next }, 'Successiva ›'))),
      h('div', { class: 'scroll' }, h('table', { class: 'grid' + (canEdit || S.extraOnly ? ' editing' : '') },
        h('caption', { style: 'position:absolute;left:-9999px' }, `Turni della settimana ${weekLabel(S.weekDays)}`),
        h('thead', null, thead), h('tbody', null, rows))),
      h('p', { class: 'legend' },
        h('span', null, h('i'), 'libero'),
        h('span', null, h('i', { class: 'l-taken' }), 'occupato'),
        h('span', null, h('i', { class: 'l-extra' }), 'ore extra (oltre il limite delle due settimane)'),
        !isAdmin ? h('span', null, h('i', { class: 'l-mine' }), 'prenotato da te') : null,
        !isCur ? h('span', null, 'Stai guardando una settimana esterna alle due settimane attualmente in prenotazione.') : null,
        S.extraOnly ? h('span', null, `Settimana in corso: puoi prenotare solo i turni liberi di oggi e di domani (quelli oltre le ${cfg.maxHours} ore complessive sono extra).`) : null,
        !isAdmin && canEdit && S.overlapOpen ? h('span', null, 'Tutti i turni delle due settimane sono occupati: puoi sovrapporti a un turno già occupato (toccalo per prenotarlo insieme a chi c\'è già).') : null,
        !isAdmin && !canEdit && isCur ? h('span', null, 'Potrai modificare i turni solo durante il tuo turno in fila.') : null));
  }

    if (!c) { main.replaceChildren(h('p', { class: 'muted' }, 'Caricamento…')); return; }
    const num = (id, label, value, hint, min, max) => h('div', { class: 'field' }, h('label', { for: id }, label),
      h('input', { id, type: 'number', value: String(value), min: String(min), max: String(max), inputmode: 'numeric' }), h('div', { class: 'hint' }, hint));
    const day = h('select', { id: 'openWeekday' }, WEEKDAYS.map((d, i) => h('option', { value: String(i), selected: i === c.openWeekday ? true : null }, d)));
    const time = h('input', { id: 'openTime', type: 'time', value: c.openTime });
    const save = async (e) => {
      e.preventDefault();
      const v = (id) => document.getElementById(id).value;
      try {
        await api('POST', '/api/admin/config', {
          turnSeconds: v('turnSeconds'), maxHours: v('maxHours'), openWeekday: v('openWeekday'),
          openTime: v('openTime'), queueEarlyMinutes: v('queueEarlyMinutes'),
        });
        toast('Impostazioni salvate'); refresh();
      } catch (ex) { toast(ex.message, true); }
    };
    main.replaceChildren(h('section', { class: 'card' },
      h('h2', null, 'Impostazioni'),
      h('form', { onsubmit: save },
        h('div', { class: 'fields' },
          num('turnSeconds', 'Durata del turno in fila (secondi)', c.turnSeconds, 'Dopo questo tempo tocca al successivo.', 10, 600),
          num('maxHours', 'Ore massime sulle due settimane per studente', c.maxHours, 'Vale complessivamente per entrambe le settimane del turno.', 1, 110),
          h('div', { class: 'field' }, h('label', { for: 'openWeekday' }, 'Giorno di apertura (ogni 2 settimane)'), day, h('div', { class: 'hint' }, 'Si prenotano le due settimane che iniziano il lunedì successivo.')),
          h('div', { class: 'field' }, h('label', { for: 'openTime' }, 'Ora di apertura'), time, h('div', { class: 'hint' }, 'Ora italiana.')),
          num('queueEarlyMinutes', 'Sala d\'attesa anticipata (minuti)', c.queueEarlyMinutes, '0 = si entra in fila solo all\'ora di apertura. Con un valore maggiore, chi arriva prima si mette prima in fila.', 0, 720)),
        h('button', { class: 'btn btn-dark', type: 'submit' }, 'Salva le impostazioni'))));
  }

  // ───────────── Pagina "Registro" ─────────────
  async function renderRegistro() {
    const main = document.getElementById('main');
    main.replaceChildren(h('p', { class: 'muted' }, 'Caricamento…'));
    try {
      const r = await api('GET', '/api/admin/log');
      if (tab !== 'registro') return;
      main.replaceChildren(h('section', { class: 'card' },
        h('h2', null, 'Registro delle attività'),
        h('p', { class: 'muted' }, 'Ultime 500 azioni: utile per chiarire chi ha prenotato o cambiato un turno.'),
        r.log.length ? h('ul', { class: 'log' }, r.log.map((l) => h('li', null, h('time', null, fmtLog(l.ts)), h('span', null, l.text))))
          : h('p', { class: 'muted' }, 'Ancora nessuna attività.')));
    } catch (ex) { toast(ex.message, true); }
  }


  // ───────────── Avvisi sullo smartphone ─────────────
  // 1) Tiene lo schermo acceso (Wake Lock) quando tocca a te o stai per essere chiamato.
  // 2) Se lo schermo si spegne o la pagina va in background proprio in quel momento,
  //    mostra una notifica (se l'utente l'ha attivata) con vibrazione.
  // 3) Quando inizia il tuo turno con la pagina aperta: suono + vibrazione.
  const Alerts = (() => {
    let wake = null, audioCtx = null, lastStatus = null, lastPos = null;
    const isStudent = () => S && me && me.role === 'student';
    const st = () => S.queue.me.status;
    // turno in corso, oppure tra i primi della fila a fila aperta
    const hot = () => isStudent() && ((st() === 'active' && S.cyclePhase === 'open') || (st() === 'waiting' && S.cyclePhase === 'open' && S.queue.me.pos <= 2));

    async function syncWake() {
      try {
        if (hot() && !document.hidden && !wake && 'wakeLock' in navigator) {
          wake = await navigator.wakeLock.request('screen');
          wake.addEventListener('release', () => { wake = null; });
        } else if (!hot() && wake) { await wake.release(); wake = null; }
      } catch { wake = null; /* risparmio energetico attivo o non supportato */ }
    }
    // Suoni riconoscibili: "now" = tre toni (Tocca a te), "warn" = cinque toni rapidi acuti
    // (mancano 10 secondi), "next" = due toni gravi (Sei il prossimo)
    const TONES = {
      now:  { freq: 880,  times: [0, 0.25, 0.5] },
      warn: { freq: 1320, times: [0, 0.12, 0.24, 0.36, 0.48] },
      next: { freq: 660,  times: [0, 0.3] }
    };
    const BUZZ = {
      now:  [500, 200, 500, 200, 800],
      warn: [150, 100, 150, 100, 150, 100, 150, 100, 150],
      next: [300, 150, 300]
    };
    function beep(kind) {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const tn = TONES[kind] || TONES.now;
        tn.times.forEach((t) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = tn.freq; o.connect(g); g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
          o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.22);
        });
      } catch { /* ignora */ }
    }
    const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch { /* ignora */ } };
    // Suono + vibrazione, una sola volta anche se arrivano sia il push sia l'aggiornamento della pagina
    let lastAlertAt = 0;
    function alertOnce(kind) {
      const t = Date.now();
      if (t - lastAlertAt < 4000) return;
      lastAlertAt = t;
      beep(kind); buzz(BUZZ[kind] || BUZZ.now);
    }
    async function notify(title, body) {
      try {
        if (!('Notification' in window) || Notification.permission !== 'granted' || !('serviceWorker' in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, { body, icon: 'icon-192.png', tag: 'turni', renotify: true, requireInteraction: true, vibrate: BUZZ.now });
      } catch { /* ignora */ }
    }
    // ── Notifiche push (arrivano anche a telefono bloccato) ──
    const VAPID_PUBLIC = 'BP2MzQk5r3ZXQBadRBOVpNAXx3daI89UGAwBNzuJ6fSWSVlMZhANTPQWAArtU-qCy1oBjIMVK_vJG_UBj8Vs-D8';
    function b64ToBytes(s) {
      const p = s + '='.repeat((4 - s.length % 4) % 4);
      return Uint8Array.from(atob(p.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    }
    async function pushOn() {
      try {
        if (!(me && me.role === 'student') || VAPID_PUBLIC.startsWith('INCOLLA')) return;
        if (!('PushManager' in window) || !('serviceWorker' in navigator) || Notification.permission !== 'granted') return;
        await navigator.serviceWorker.register('sw.js');
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
        await api('POST', '/api/push/subscribe', { sub: sub.toJSON() });
      } catch { /* ignora: restano gli avvisi locali */ }
    }
    async function pushOff() {
      pushDone = false;
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg && await reg.pushManager.getSubscription();
        if (!sub) return;
        const ep = sub.endpoint;
        await sub.unsubscribe();
        await api('POST', '/api/push/unsubscribe', { endpoint: ep });
      } catch { /* ignora */ }
    }
    async function clearNotifications() {
      try {
        if (!('serviceWorker' in navigator)) return;
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) (await reg.getNotifications({ tag: 'turni' })).forEach((n) => n.close());
      } catch { /* ignora */ }
    }
    function init() {
      if (!isStudent()) return;
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch { /* ignora */ }
      // Un avviso push arriva mentre la pagina è aperta: suono e vibrazione li fa la pagina
      try {
        if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (ev) => {
          const m = ev.data;
          if (m && m.type === 'push' && !document.hidden) alertOnce(m.kind);
        });
      } catch { /* ignora */ }
      // il suono richiede un primo tocco dell'utente
      document.addEventListener('pointerdown', () => {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        else if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }, { once: false, passive: true });
    }
    let pushDone = false;
    function onState() {
      if (!isStudent()) return;
      if (!pushDone) { pushDone = true; pushOn(); }
      const s = st(), pos = S.queue.me.pos;
      // Se si passa da "fuori fila" direttamente a "attivo" il turno è partito subito dopo
      // aver premuto «Entra in fila»: nessun suono né avviso (la pagina è davanti all'utente).
      if (s === 'active' && lastStatus !== 'active' && (lastStatus === 'waiting' || lastStatus === null) && S.cyclePhase === 'open') {
        if (!document.hidden) { alertOnce('now'); }
        else notify('Tocca a te!', 'Riapri la pagina: il tuo turno è iniziato.');
      } else if (s === 'waiting' && pos === 0 && lastPos !== 0 && lastStatus === 'waiting' && !document.hidden) {
        buzz(200);
      }
      lastStatus = s; lastPos = pos;
      syncWake();
    }
    document.addEventListener('visibilitychange', () => {
      if (!isStudent()) return;
      if (document.hidden) {
        // schermo spento, telefono bloccato o cambio di app mentre il turno è vicino o in corso
        if (st() === 'active' && S.cyclePhase === 'open') notify('Il tuo turno è in corso', 'Lo schermo si è spento o hai lasciato la pagina: riaprila subito, il tempo sta scorrendo.');
      } else {
        clearNotifications();
        syncWake();
      }
    });
    // Riquadro con il pulsante per attivare le notifiche (serve un tocco dell'utente)
    function control() {
      if (!isStudent()) return null;
      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        return h('p', { class: 'muted small' }, 'Avvisi a schermo spento: su iPhone funzionano solo se aggiungi la pagina alla schermata Home (Condividi → «Aggiungi alla schermata Home») e la apri da lì.');
      }
      if (Notification.permission === 'granted') return h('p', { class: 'muted small' }, '🔔 Avvisi attivi: lo schermo resta acceso durante il tuo turno e, se si spegne, ricevi una notifica.');
      if (Notification.permission === 'denied') return h('p', { class: 'muted small' }, 'Le notifiche sono bloccate nelle impostazioni del browser: riattivale per questo sito se vuoi ricevere gli avvisi.');
      return h('div', { class: 'row' }, h('button', { class: 'btn btn-sm', type: 'button', onclick: async (ev) => {
        try {
          if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const r = await Notification.requestPermission();
          if (r === 'granted') { await pushOn(); toast('Avvisi attivati'); if (S) renderTurni(); }
        } catch { /* ignora */ }
      } }, '🔔 Attiva gli avvisi sul telefono'));
    }
    return { init, onState, control, pushOff };
  })();

  // ───────────── Avvio ─────────────
  (async function boot() {
    try {
      const r = await api('GET', '/api/me');
      me = r.user;
    } catch { showLogin(); return; }
    if (me.mustChange) showForcedChange(); else startApp();
  })();
})();

  </script>
